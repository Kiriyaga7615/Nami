name: build_upload_release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Permissions
        run: chmod +x gradlew

      - name: Get version
        id: version
        run: echo "version=$(./gradlew -q printVersion)" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$LAST_TAG" ]]; then
            COMMITS=$(git rev-list HEAD)
          else
            COMMITS=$(git rev-list ${LAST_TAG}..HEAD)
          fi

          BODY=""

          for SHA in $COMMITS; do
            MSG=$(git show -s --format=%s $SHA)
            AUTHOR_NAME=$(git show -s --format=%an $SHA)

            LOGIN=$(curl -s \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/commits/$SHA \
              | jq -r '.author.login // empty')

            if [[ -n "$LOGIN" ]]; then
              BODY+="- ${MSG} by [@${LOGIN}](https://github.com/${LOGIN})\n"
            else
              BODY+="- ${MSG} by ${AUTHOR_NAME}\n"
            fi
          done

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo -e "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nami-client
          path: nami-client/build/libs/*.jar

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: nami-client/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
